<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>EchoWave Chat Room</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      background: #0b1020; 
      color: #fff; 
      margin: 0; 
      padding: 0;
    }
    .container {
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #4fc3f7;
    }
    .messages {
      background: #11162e;
      border: 1px solid #333;
      height: 350px;
      overflow-y: auto;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 6px;
    }
    .input-row {
      display: flex;
      gap: 10px;
    }
    input {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: none;
    }
    button {
      padding: 10px 20px;
      background: #4fc3f7;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>EchoWave</h1>

    <div class="messages" id="messages"></div>

    <div class="input-row">
      <input id="messageInput" placeholder="Type a message..." />
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    sendBtn.onclick = () => {
      const text = inputEl.value.trim();
      if (!text) return;

      const msg = document.createElement('div');
      msg.textContent = "You: " + text;
      messagesEl.appendChild(msg);

      inputEl.value = "";
      messagesEl.scrollTop = messagesEl.scrollHeight;
    };
  </script>
</body>
</html>
